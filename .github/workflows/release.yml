name: Create deployment release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag ref
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "::error::Run this workflow from a release tag."
            exit 1
          fi

      - name: Package deployment configs
        run: tar -czf "demo-deployment-${GITHUB_REF_NAME}.tar.gz" environments/

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: demo-deployment-${{ github.ref_name }}.tar.gz
          fail_on_unmatched_files: true
          overwrite_files: true