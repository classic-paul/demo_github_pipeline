name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        required: true
        options:
          - dev
          - uat
          - pre
          - prod

# Ref is chosen via the "Use workflow from" dropdown (branch or tag).
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    # In a real setup: platform/shared-workflows/.github/workflows/terraform-deploy.yml@v1
    uses: ./.github/workflows/terraform-deploy.yml
    with:
      environment: ${{ inputs.environment }}
    secrets: inherit
